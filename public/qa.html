<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>フリー質問 オペレーター卓</title>
<style>
  :root {
    --bg:#0e1512; --panel:#161f1b; --line:#2a3630;
    --ink:#e6ece8; --ink-2:#a9b8b0; --muted:#7d8f86;
    --green:#7fd4ab; --lime:#b8d935; --warn:#ff8a70;
    --mono: ui-monospace, "SFMono-Regular", "Menlo", "Consolas", monospace;
    --ja: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", "Meiryo", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--ja); background: var(--bg); color: var(--ink); height: 100dvh; display: flex; flex-direction: column; }
  header { padding: 10px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
  header h1 { font-size: 15px; font-weight: 700; letter-spacing: .04em; }
  header .tag { font-family: var(--mono); font-size: 11px; color: var(--green); background: rgba(127,212,171,.12); padding: 3px 9px; border-radius: 3px; }
  header .state { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--muted); }
  header .state.on { color: var(--green); }
  header .state.off { color: var(--warn); }

  main { flex: 1; display: grid; grid-template-columns: 300px 1fr; gap: 0; overflow: hidden; }

  /* 想定質問（左） */
  .side { border-right: 1px solid var(--line); overflow-y: auto; padding: 14px; }
  .side h2 { font-size: 11px; font-family: var(--mono); letter-spacing: .12em; color: var(--green); margin-bottom: 10px; }
  .side button {
    display: block; width: 100%; text-align: left; font-family: inherit; font-size: 13.5px; line-height: 1.5;
    background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px;
    padding: 11px 13px; margin-bottom: 8px; cursor: pointer;
  }
  .side button:hover { border-color: var(--lime); }
  .side button .badge {
    display: inline-block; font-family: var(--mono); font-size: 10px; letter-spacing: .06em;
    padding: 1px 6px; border-radius: 3px; margin-top: 6px;
  }
  .side button .badge.ready { background: rgba(184,217,53,.18); color: var(--lime); }
  .side button .badge.live { background: rgba(255,138,112,.15); color: var(--warn); }

  /* 回答表示（右） */
  .stage { display: flex; flex-direction: column; padding: 18px 22px; overflow: hidden; }
  .qline { font-size: 13px; color: var(--green); font-family: var(--mono); margin-bottom: 8px; min-height: 20px; }
  #answer {
    flex: 1; overflow-y: auto; font-size: 26px; line-height: 1.85; font-weight: 500;
    white-space: pre-wrap; padding: 16px 18px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px;
  }
  #answer .ph { color: var(--muted); font-size: 18px; font-weight: 400; }
  #answer .thinking { color: var(--ink-2); font-size: 20px; }
  .hint2 { font-size: 12px; color: var(--muted); margin-top: 8px; }

  /* 操作 */
  .bar { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .bar input {
    flex: 1; min-width: 240px; font-family: inherit; font-size: 16px; padding: 13px 16px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; color: var(--ink); outline: none;
  }
  .bar input:focus { border-color: var(--green); }
  button.act {
    font-family: inherit; font-size: 15px; font-weight: 700; padding: 13px 22px; border: none;
    border-radius: 8px; cursor: pointer; background: var(--lime); color: #16210c;
  }
  button.act.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  button.act:disabled { opacity: .45; cursor: default; }
  button.act.big { font-size: 16px; padding: 13px 30px; }

  /* ゲート */
  .gate { position: fixed; inset: 0; background: rgba(6,14,10,.97); display: flex; align-items: center; justify-content: center; z-index: 50; }
  .gate form { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 28px; width: 340px; text-align: center; }
  .gate h2 { font-size: 15px; margin-bottom: 14px; }
  .gate input { width: 100%; padding: 12px; font-size: 16px; text-align: center; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; color: var(--ink); margin-bottom: 10px; }
  .gate button { width: 100%; padding: 12px; font-family: inherit; font-size: 15px; font-weight: 700; border: none; border-radius: 8px; background: var(--green); color: #06120c; cursor: pointer; }
  .gate .err { color: var(--warn); font-size: 12px; min-height: 16px; margin-top: 8px; }

  @media (max-width: 800px) { main { grid-template-columns: 1fr; } .side { display: none; } }
</style>
</head>
<body>
  <header>
    <h1>フリー質問 オペレーター卓</h1>
    <span class="tag">#4 専用</span>
    <span class="state" id="voiceState">音声：確認中</span>
  </header>

  <main>
    <aside class="side">
      <h2>想定質問（即再生）</h2>
      <div id="presets"></div>
      <h2 style="margin-top:18px">使い方</h2>
      <p style="font-size:12px;color:var(--muted);line-height:1.7">
        想定質問は<b>クリックで即再生</b>。<br>
        想定外の質問は下の入力欄へ。<br>
        音声が出ない時は、右の文字を演者が読めば成立します。
      </p>
    </aside>

    <section class="stage">
      <div class="qline" id="qline"></div>
      <div id="answer"><span class="ph">想定質問をクリックするか、下に質問を入力してください。</span></div>
      <div class="bar">
        <input id="input" type="text" placeholder="会場からの質問を入力して Enter">
        <button class="act big" id="goBtn" type="button">生成して喋る</button>
        <button class="act ghost" id="replayBtn" type="button" disabled>🔊 もう一度</button>
        <button class="act ghost" id="stopBtn" type="button">■ 停止</button>
      </div>
      <p class="hint2">Enter＝生成して喋る／Esc＝音声停止。生成した音声は自動でキャッシュされ、次回は即再生になります。</p>
    </section>
  </main>

  <div class="gate" id="gate">
    <form id="gateForm">
      <h2>合言葉を入力（開始前に1回）</h2>
      <input id="gateInput" type="text" placeholder="合言葉" autocomplete="off">
      <button type="submit">開始</button>
      <div class="err" id="gateErr"></div>
    </form>
  </div>

<script>
const $ = (id) => document.getElementById(id);
let token = sessionStorage.getItem("qaToken") || "";
let busy = false, lastText = "", audio = null;

// --- 合言葉 ---
if (token) $("gate").style.display = "none";
$("gateForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  try {
    const r = await fetch("/api/verify", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ passphrase: $("gateInput").value.trim() }),
    });
    const d = await r.json();
    if (r.ok && d.token) { token = d.token; sessionStorage.setItem("qaToken", token); $("gate").style.display = "none"; }
    else $("gateErr").textContent = "合言葉が違います。";
  } catch { $("gateErr").textContent = "通信エラーです。"; }
});

// --- 想定質問の読み込み ---
let presets = [];
fetch("/api/qa-presets").then(r => r.json()).then(d => {
  presets = d.presets || [];
  const box = $("presets");
  presets.forEach((p, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.innerHTML = p.q.replace(/</g, "&lt;") +
      `<br><span class="badge ${p.answer ? "ready" : "live"}">${p.answer ? "回答準備済み" : "その場で生成"}</span>`;
    b.addEventListener("click", () => run(p.q, p.answer || ""));
    box.appendChild(b);
  });
  const ok = d.voiceReady;
  $("voiceState").textContent = ok ? "音声：接続OK" : "音声：未設定（文字のみ）";
  $("voiceState").className = "state " + (ok ? "on" : "off");
}).catch(() => {});

// --- 回答を出して喋らせる ---
async function run(question, presetAnswer) {
  if (busy) return;
  busy = true; $("goBtn").disabled = true;
  $("qline").textContent = "Q. " + question;
  try {
    let text = presetAnswer;
    if (!text) {
      $("answer").innerHTML = '<span class="thinking">回答を作っています…</span>';
      const r = await fetch("/api/chat", {
        method: "POST",
        headers: { "content-type": "application/json", authorization: "Bearer " + token },
        body: JSON.stringify({ messages: [{ role: "user", content: question }], mode: "normal" }),
      });
      if (r.status === 401) {
        token = ""; sessionStorage.removeItem("qaToken");
        $("gate").style.display = ""; $("gateErr").textContent = "セッションが切れました。再入力してください。";
        return;
      }
      const d = await r.json();
      text = (d.reply || d.error || "…").replace(/※.*$/s, "").trim();
    }
    lastText = text;
    $("answer").textContent = text;   // 音声が出なくても演者が読めるよう、先に文字を出す
    $("replayBtn").disabled = false;
    await speak(text);
  } catch (e) {
    $("answer").textContent = "エラーが発生しました。表示中の文字を演者が読んでください。";
  } finally {
    busy = false; $("goBtn").disabled = false;
  }
}

async function speak(text) {
  stopAudio();
  try {
    const r = await fetch("/api/speak", {
      method: "POST",
      headers: { "content-type": "application/json", authorization: "Bearer " + token },
      body: JSON.stringify({ text }),
    });
    if (!r.ok) { $("voiceState").textContent = "音声：失敗（文字を読んでください）"; $("voiceState").className = "state off"; return; }
    const blob = await r.blob();
    audio = new Audio(URL.createObjectURL(blob));
    audio.play();
    const cached = r.headers.get("x-tts-cache") === "hit";
    $("voiceState").textContent = cached ? "音声：再生中（キャッシュ）" : "音声：再生中";
    $("voiceState").className = "state on";
  } catch {
    $("voiceState").textContent = "音声：失敗（文字を読んでください）";
    $("voiceState").className = "state off";
  }
}
function stopAudio() { if (audio) { audio.pause(); audio = null; } }

$("goBtn").addEventListener("click", () => { const v = $("input").value.trim(); if (v) { run(v, ""); $("input").value = ""; } });
$("input").addEventListener("keydown", (e) => { if (e.key === "Enter") $("goBtn").click(); });
$("replayBtn").addEventListener("click", () => { if (lastText) speak(lastText); });
$("stopBtn").addEventListener("click", stopAudio);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") stopAudio(); });
</script>
</body>
</html>
