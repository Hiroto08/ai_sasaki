<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>応対ログ｜AI社長</title>
<style>
  :root {
    --bg: #f2f5f1; --card: #fff; --line: #dfe5dd;
    --ink: #1d2b22; --ink-2: #4a5a50; --ink-3: #86958b;
    --deep: #14532d; --lime: #84cc16; --lime-tint: #f0f7e2; --spicy: #c2410c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, system-ui, sans-serif;
    font-size: 14px;
  }
  header {
    background: var(--deep); color: #fff; padding: 14px 20px;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 700; letter-spacing: .04em; }
  header .spacer { flex: 1; }
  main { padding: 18px 20px 60px; max-width: 1200px; margin: 0 auto; }

  .gate { max-width: 420px; margin: 80px auto; background: var(--card); border: 1px solid var(--line);
          border-radius: 14px; padding: 26px; }
  .gate h2 { margin: 0 0 6px; font-size: 16px; }
  .gate p { margin: 0 0 16px; color: var(--ink-2); font-size: 12.5px; line-height: 1.7; }

  input[type=text], input[type=password], select {
    font: inherit; padding: 9px 12px; border: 1px solid var(--line);
    border-radius: 8px; background: #fff; color: var(--ink); width: 100%;
  }
  button {
    font: inherit; font-weight: 600; padding: 9px 16px; border-radius: 8px;
    border: 1px solid var(--line); background: #fff; color: var(--deep); cursor: pointer;
  }
  button.primary { background: var(--deep); color: #fff; border-color: var(--deep); }
  button:hover { border-color: var(--lime); }
  .err { color: var(--spicy); font-size: 12.5px; min-height: 1.2em; margin-top: 10px; }

  .stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .stat {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 18px; min-width: 108px;
  }
  .stat .k { font-size: 11px; color: var(--ink-3); letter-spacing: .06em; }
  .stat .v { font-size: 24px; font-weight: 700; line-height: 1.3; }
  .stat .v small { font-size: 12px; font-weight: 600; color: var(--ink-3); }

  .bar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .bar .grow { flex: 1; min-width: 180px; }

  table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 12px; overflow: hidden; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { background: var(--lime-tint); font-size: 11.5px; color: var(--ink-2); letter-spacing: .05em; white-space: nowrap; }
  td { font-size: 13px; line-height: 1.7; }
  td.ts, td.uid { white-space: nowrap; color: var(--ink-3); font-size: 11.5px; }
  td.q { font-weight: 600; }
  td.a { color: var(--ink-2); white-space: pre-wrap; }
  tr.spicy td.q::before { content: "🌶 "; }
  .tag { font-size: 10.5px; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-3); white-space: nowrap; }
  .tag.err { border-color: var(--spicy); color: var(--spicy); }
  .empty { text-align: center; color: var(--ink-3); padding: 50px 0; }
  .hint { font-size: 12px; color: var(--ink-3); line-height: 1.8; margin-top: 20px; }
  mark { background: #fde68a; }
  @media (max-width: 640px) {
    td.ts, td.uid, th.ts, th.uid { display: none; }
    main { padding: 14px 12px 50px; }
  }
</style>
</head>
<body>

<div class="gate" id="gate">
  <h2>応対ログ</h2>
  <p>管理キー（デプロイ時に設定した <code>ADMIN_KEY</code>）を入力してください。</p>
  <input type="password" id="key" placeholder="ADMIN_KEY" autocomplete="off">
  <div class="err" id="gateErr"></div>
  <p style="margin:14px 0 0"><button class="primary" id="enter" style="width:100%">開く</button></p>
</div>

<div id="app" hidden>
  <header>
    <h1>📋 応対ログ</h1>
    <span id="updated" style="font-size:11.5px;opacity:.75"></span>
    <span class="spacer"></span>
    <button id="reload">↻ 更新</button>
    <button id="csv">⬇ CSVで保存</button>
  </header>
  <main>
    <div class="stats" id="stats"></div>
    <div class="bar">
      <span class="grow"><input type="text" id="q" placeholder="キーワードで絞り込む（質問・回答の両方を検索）"></span>
      <select id="filter" style="width:auto">
        <option value="">すべて</option>
        <option value="spicy">辛口モードのみ</option>
        <option value="error">APIエラー時のみ</option>
      </select>
      <label style="font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:5px">
        <input type="checkbox" id="auto"> 30秒ごとに自動更新
      </label>
    </div>
    <div id="table"></div>
    <p class="hint">
      ログはサーバーのメモリ上に最大3000件保持されます。<br>
      <strong>コンテナが再起動すると消えるので、イベント終了後は必ずCSVで保存してください。</strong><br>
      （同じ内容は Cloud Logging にも <code>CHATLOG</code> という文字列付きで残っています。
      　Google Cloud コンソールの「ログエクスプローラ」で <code>CHATLOG</code> を検索すると取り出せます）
    </p>
  </main>
</div>

<script>
const $ = (id) => document.getElementById(id);
let KEY = "";
let ALL = [];
let timer = null;

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function hi(s, kw) {
  const t = esc(s);
  if (!kw) return t;
  return t.replace(new RegExp(kw.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), (m) => `<mark>${m}</mark>`);
}
const jst = (iso) => new Date(iso).toLocaleString("ja-JP", { timeZone: "Asia/Tokyo", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" });

async function load() {
  const res = await fetch("/api/admin/logs?key=" + encodeURIComponent(KEY));
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "読み込みに失敗しました");
  ALL = data.logs || [];
  renderStats(data.stats || {});
  render();
  $("updated").textContent = "最終更新 " + new Date().toLocaleTimeString("ja-JP");
}

function renderStats(s) {
  const cards = [
    ["発話数", s.total || 0, ""],
    ["利用者数", s.users || 0, "人"],
    ["辛口モード", s.spicy || 0, "回"],
    ["APIエラー", s.errors || 0, "回"],
    ["応答時間（中央値）", ((s.medianMs || 0) / 1000).toFixed(1), "秒"],
  ];
  $("stats").innerHTML = cards.map(([k, v, u]) =>
    `<div class="stat"><div class="k">${k}</div><div class="v">${v}<small>${u}</small></div></div>`).join("");
}

function render() {
  const kw = $("q").value.trim();
  const f = $("filter").value;
  let rows = ALL;
  if (f === "spicy") rows = rows.filter((r) => r.mode === "spicy");
  if (f === "error") rows = rows.filter((r) => r.replyMode === "demo-fallback");
  if (kw) {
    const k = kw.toLowerCase();
    rows = rows.filter((r) => (r.q + " " + r.a).toLowerCase().includes(k));
  }
  if (!rows.length) {
    $("table").innerHTML = '<div class="empty">' +
      (ALL.length ? "条件に合うログはありません。" : "まだ会話がありません。") + "</div>";
    return;
  }
  // 新しいものを上に
  const body = rows.slice().reverse().map((r) => `
    <tr class="${r.mode === "spicy" ? "spicy" : ""}">
      <td class="ts">${jst(r.ts)}</td>
      <td class="uid">${esc(r.uid)}</td>
      <td class="q">${hi(r.q, kw)}</td>
      <td class="a">${hi(r.a, kw)}</td>
      <td><span class="tag ${r.replyMode === "demo-fallback" ? "err" : ""}">${esc(r.replyMode)}</span></td>
    </tr>`).join("");
  $("table").innerHTML = `<table>
    <thead><tr>
      <th class="ts">日時</th><th class="uid">利用者</th>
      <th style="width:26%">質問</th><th>回答</th><th>種別</th>
    </tr></thead><tbody>${body}</tbody></table>
    <p class="hint">${rows.length} 件を表示中（全 ${ALL.length} 件）</p>`;
}

$("enter").addEventListener("click", async () => {
  KEY = $("key").value.trim();
  if (!KEY) { $("gateErr").textContent = "管理キーを入力してください。"; return; }
  try {
    await load();
    $("gate").hidden = true;
    $("app").hidden = false;
    sessionStorage.setItem("adminKey", KEY);
  } catch (e) {
    $("gateErr").textContent = e.message;
  }
});
$("key").addEventListener("keydown", (e) => { if (e.key === "Enter") $("enter").click(); });
$("reload").addEventListener("click", () => load().catch((e) => alert(e.message)));
$("csv").addEventListener("click", () => {
  location.href = "/api/admin/logs.csv?key=" + encodeURIComponent(KEY);
});
$("q").addEventListener("input", render);
$("filter").addEventListener("change", render);
$("auto").addEventListener("change", (e) => {
  clearInterval(timer);
  if (e.target.checked) timer = setInterval(() => load().catch(() => {}), 30000);
});

// 同じタブで開き直したときはキーを覚えている（タブを閉じれば消える）
const saved = sessionStorage.getItem("adminKey");
if (saved) { $("key").value = saved; $("enter").click(); }
</script>
</body>
</html>
