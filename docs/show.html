<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>本番進行ランナー｜AI社長 余興</title>
<style>
  /* ============================================================
     本番進行ランナー
     タイトル → 登場動画 → 自己紹介動画 → Q1 → Q2 → Q3 → QR
     を1枚のページで通す。ページ遷移が起きないので画面切り替えが発生しない。
     本編のあいだには「つなぎスライド」を挟んであり、MCが喋っている間はそれを映す。

     操作：→/Enter/クリック=次へ  Space=動画の再生/一時停止  ←=戻る
           B=暗転  H=進行情報の表示  C=印刷用カンペ

     ★Space に「進む」を割り当てていないのは、動画を止めようとして
       次に飛ぶ事故を防ぐため。進行は → のみ。

     ★動画はファイル名に依存しない。開始画面に動画をドロップすれば
       上から順に割り当たる（docs/video/ に規定の名前で置いてあれば自動）。
     ============================================================ */
  :root {
    --deep: #00432e;
    --lime: #b8d935;
    --ink: #f4f7f2;
    --dim: #93a89b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; background: #000; color: var(--ink); overflow: hidden;
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif;
    font-feature-settings: "palt";
  }
  body.hide-cursor { cursor: none; }

  /* ---- ステージ（全スライドを重ねて置き、不透明度で見せ替える）---- */
  #stage { position: fixed; inset: 0; }
  .slide {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 6vh 8vw; text-align: center;
    opacity: 0; visibility: hidden;
    transition: opacity .5s ease;
    background: radial-gradient(120% 90% at 50% 0%, #0b3b28 0%, #041a12 55%, #000 100%);
  }
  .slide.on { opacity: 1; visibility: visible; }
  .slide.plain { background: #000; }
  .slide video { width: 100%; height: 100%; object-fit: contain; background: #000; }

  /* ---- タイトルスライド（社内の極秘レビュー資料に見せる）---- */
  .slide.title {
    background:
      radial-gradient(80% 60% at 78% -8%, rgba(184,217,53,.16) 0%, transparent 58%),
      radial-gradient(70% 55% at 8% 108%, rgba(10,107,74,.5) 0%, transparent 60%),
      linear-gradient(150deg, #001a13 0%, #00301f 55%, #004530 100%);
  }
  /* 目の細かい罫線。書類っぽさを足す */
  .slide.title::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, transparent 0 6px, rgba(255,255,255,.016) 6px 7px);
  }
  .title .badge {
    display: inline-flex; align-items: center; gap: 1.2em;
    border: 2px solid #e2564a; color: #ff8c7f;
    font-size: 1.9vh; font-weight: 800; letter-spacing: .42em;
    padding: 1vh 2.6vh; border-radius: 4px; margin-bottom: 5vh; padding-right: 1.2vh;
  }
  .title .kicker {
    font-size: 3.2vh; letter-spacing: .58em; color: var(--lime); font-weight: 700;
    margin-bottom: 3vh; padding-left: .58em;
  }
  .title h1 {
    font-size: 8.6vh; font-weight: 800; letter-spacing: .02em; line-height: 1.3;
    max-width: 92vw;
  }
  .title .rule { width: 16vh; height: 4px; background: var(--lime); border-radius: 2px; margin: 5vh 0 4vh; }
  .title .sub { font-size: 4vh; color: #dbe8dd; line-height: 1.8; font-weight: 600; letter-spacing: .12em; }
  .title .foot {
    position: absolute; left: 0; right: 0; bottom: 4vh;
    font-size: 1.7vh; color: rgba(255,255,255,.32); letter-spacing: .3em;
  }

  /* ---- つなぎスライド（MCが喋っている間に映しておく）----
     真っ黒だと「映写が落ちた？」に見えるので、静かに動き続けさせる。
     ただしMCより目立ってはいけないので、動きは最小限にする。 */
  .slide.bridge {
    background:
      radial-gradient(70% 55% at 50% 50%, rgba(10,107,74,.35) 0%, transparent 65%),
      linear-gradient(160deg, #001510 0%, #00241a 60%, #000f0b 100%);
  }
  .slide.bridge::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, transparent 0 6px, rgba(255,255,255,.014) 6px 7px);
  }
  .bridge .mark {
    font-size: 2.2vh; letter-spacing: .42em; color: rgba(184,217,53,.72);
    font-weight: 700; margin-bottom: 5vh; padding-left: .42em;
  }
  .bridge .cap { font-size: 5.6vh; font-weight: 700; line-height: 1.6; letter-spacing: .04em; }
  .bridge .cap .n {
    display: block; font-size: 2.4vh; letter-spacing: .5em; color: var(--lime);
    margin-bottom: 2.4vh; padding-left: .5em; font-weight: 800;
  }
  /* ゆっくり呼吸する3点。ここだけが動く */
  .bridge .dots { display: flex; gap: 1.6vh; margin-top: 6vh; }
  .bridge .dots i {
    width: 1.3vh; height: 1.3vh; border-radius: 50%; background: var(--lime);
    opacity: .25; animation: breathDot 2.8s ease-in-out infinite;
  }
  .bridge .dots i:nth-child(2) { animation-delay: .35s; }
  .bridge .dots i:nth-child(3) { animation-delay: .7s; }
  @keyframes breathDot {
    0%, 100% { opacity: .18; transform: scale(.86); }
    50%      { opacity: .85; transform: scale(1); }
  }
  .bridge .foot {
    position: absolute; left: 0; right: 0; bottom: 4vh;
    font-size: 1.5vh; color: rgba(255,255,255,.2); letter-spacing: .34em;
  }

  /* ---- 汎用テキスト・待機 ---- */
  .standby-title { font-size: 7vh; font-weight: 800; letter-spacing: .06em; }
  .standby-sub { font-size: 3vh; color: var(--dim); margin-top: 3vh; }

  /* ---- クイズのA/Bスライド（既定では使っていない。必要なら SHOW に足す）---- */
  .kicker2 { font-size: 2.2vh; letter-spacing: .35em; color: var(--lime); font-weight: 700; margin-bottom: 3vh; }
  .qtext { font-size: 5.4vh; font-weight: 700; line-height: 1.7; white-space: pre-wrap; }
  .qnum {
    display: inline-block; font-size: 3vh; font-weight: 800; letter-spacing: .1em;
    color: #041a12; background: var(--lime); border-radius: 999px; padding: .5vh 3vh; margin-bottom: 4vh;
  }
  .ab { display: flex; gap: 4vh; width: 100%; max-width: 1500px; margin-top: 2vh; }
  .opt {
    flex: 1; background: rgba(255,255,255,.06); border: 2px solid rgba(184,217,53,.35);
    border-radius: 2.4vh; padding: 4vh 3.4vh; text-align: left;
  }
  .opt .tag { font-size: 4.6vh; font-weight: 800; color: var(--lime); display: block; margin-bottom: 2vh; line-height: 1; }
  .opt p { font-size: 3.2vh; line-height: 1.75; }

  /* ---- QR ---- */
  .slide.qr img { width: 100%; height: 100%; object-fit: contain; }
  .qr-fallback { font-size: 3.4vh; line-height: 2; }
  .qr-fallback code { color: var(--lime); font-size: 3.4vh; word-break: break-all; }

  /* 動画が割り当たっていないときの代役（通し稽古用） */
  .missing {
    border: 3px dashed rgba(184,217,53,.5); border-radius: 2vh;
    padding: 6vh 8vh; font-size: 3.4vh; line-height: 2;
  }
  .missing b { color: var(--lime); font-size: 4.4vh; }

  /* ---- 暗転 ---- */
  #blackout { position: fixed; inset: 0; background: #000; z-index: 50; opacity: 0; visibility: hidden; transition: opacity .3s ease; }
  #blackout.on { opacity: 1; visibility: visible; }

  /* ---- 進行情報（★既定は非表示。会場に映るため）---- */
  #hud {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
    background: rgba(0,0,0,.86); border-top: 2px solid var(--lime);
    padding: 10px 18px; display: none; align-items: center; gap: 22px; font-size: 14px;
  }
  #hud.on { display: flex; }
  #hud .now { font-weight: 800; color: var(--lime); font-size: 16px; }
  #hud .next { color: var(--dim); }
  #hud .keys { color: var(--dim); font-size: 12px; }
  #hud .vstate { color: #ffd166; font-weight: 700; }
  #hud .clock { margin-left: auto; font-variant-numeric: tabular-nums; font-size: 20px; font-weight: 700; }

  /* ---- 開始画面（動画の割り当て・事前読み込み・音声の解錠）---- */
  #boot {
    position: fixed; inset: 0; z-index: 100; background: #04140e; overflow-y: auto;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2vh; padding: 4vh 6vw; text-align: center;
  }
  #boot.done { display: none; }
  #boot h1 { font-size: 3.4vh; letter-spacing: .08em; }
  #boot .note { color: var(--dim); font-size: 1.9vh; line-height: 1.95; max-width: 52em; }
  #boot .note b { color: var(--lime); }

  /* 動画の割り当て表 */
  /* 行数が増えても開始画面からはみ出さないよう、表の中だけスクロールさせる */
  #slots {
    width: min(880px, 92vw); border: 1px solid rgba(184,217,53,.3); border-radius: 14px;
    max-height: 44vh; overflow-y: auto; overscroll-behavior: contain;
  }
  .slot {
    display: flex; align-items: center; gap: 14px; padding: 9px 16px;
    border-bottom: 1px solid rgba(255,255,255,.08); font-size: 15px; text-align: left;
  }
  .slot:last-child { border-bottom: none; }
  .slot.drop-hover { background: rgba(184,217,53,.16); }
  .slot .no {
    width: 30px; height: 30px; flex-shrink: 0; border-radius: 50%;
    background: rgba(255,255,255,.1); color: var(--dim);
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px;
  }
  .slot.ok .no { background: var(--lime); color: #04140e; }
  .slot .name { flex: 1; min-width: 0; font-weight: 700; }
  .slot .file { color: var(--dim); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 34%; }
  .slot.ok .file { color: var(--lime); }
  .slot .file.none { color: #ffb4a2; }
  /* 中身を目で確かめるための小さなプレビュー（クリックで音なし再生） */
  .slot .thumb {
    width: 92px; height: 52px; flex-shrink: 0; border-radius: 6px; background: #000;
    object-fit: cover; cursor: pointer; border: 1px solid rgba(255,255,255,.15);
  }
  .slot .thumb.empty { background: rgba(255,255,255,.05); }
  .slot .swap { display: flex; flex-direction: column; gap: 2px; flex-shrink: 0; }
  .slot .swap button {
    font: inherit; font-size: 11px; line-height: 1; padding: 3px 7px; cursor: pointer;
    background: rgba(255,255,255,.1); color: var(--ink); border: none; border-radius: 4px;
  }
  .slot .swap button:hover { background: var(--lime); color: #04140e; }
  .slot .swap button:disabled { opacity: .25; cursor: default; }
  #checkNote { color: #ffd166; font-size: 1.7vh; }

  #drop {
    width: min(880px, 92vw); border: 2px dashed rgba(184,217,53,.55); border-radius: 14px;
    padding: 3vh 3vw; font-size: 2.1vh; line-height: 1.9; cursor: pointer;
    transition: background .2s, border-color .2s;
  }
  #drop.hover { background: rgba(184,217,53,.14); border-color: var(--lime); }
  #drop b { color: var(--lime); }
  #drop small { color: var(--dim); font-size: 1.6vh; }
  #picker { display: none; }

  .bar { width: min(880px, 92vw); height: 10px; background: rgba(255,255,255,.12); border-radius: 999px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--lime); transition: width .25s ease; }
  #bootStat { font-size: 1.8vh; color: var(--dim); font-variant-numeric: tabular-nums; }
  #startBtn {
    font: inherit; font-size: 2.8vh; font-weight: 800; letter-spacing: .1em;
    padding: 2vh 7vh; border: none; border-radius: 999px;
    background: var(--lime); color: #04140e; cursor: pointer;
  }
  #startBtn:disabled { opacity: .35; cursor: progress; }
  #bootErr { color: #ffd166; font-size: 1.8vh; line-height: 1.8; max-width: 52em; }
</style>
</head>
<body>

<div id="stage"></div>
<div id="blackout"></div>

<div id="hud">
  <span class="now" id="hudNow">—</span>
  <span class="vstate" id="hudV"></span>
  <span class="next" id="hudNext"></span>
  <span class="keys">→次へ ／ Space動画停止 ／ ←戻る ／ B暗転 ／ Hこの帯 ／ Cカンペ印刷</span>
  <span class="clock" id="hudClock">00:00</span>
</div>

<div id="boot">
  <h1>本番進行ランナー</h1>
  <p class="note">
    このまま<b>フルスクリーン</b>で通します。本番中に画面の切り替えは起きません。<br>
    進行は <b>→</b>、動画の一時停止は <b>Space</b>。<b>「開始」で音声が解錠されます</b>（押さないと動画が無音になります）。
  </p>

  <div id="slots"></div>

  <div id="drop">
    <b>ここに動画とQR画像をまとめてドロップ</b>（クリックでファイル選択も可）<br>
    <small>ファイル名は何でも構いません。<b>動画は動画の枠へ、画像はQRの枠へ、名前順に上から入ります。</b>
    1つだけ差し替えたいときは、その行に直接ドロップしてください。</small>
  </div>
  <input type="file" id="picker" accept="video/*,image/*" multiple>

  <div class="bar"><i id="bootBar"></i></div>
  <div id="bootStat">素材を探しています…</div>
  <div id="checkNote"></div>
  <div id="bootErr"></div>
  <button id="startBtn" disabled>開始</button>
</div>

<script>
/* ================================================================
   ★ここだけ書き換えれば本番の中身が変わります
   ================================================================ */

// タイトルスライド
const TITLE = {
  badge:  "CONFIDENTIAL ／ 社外秘",
  kicker: "極秘プロジェクト",
  main:   "「AI社長（President-1.0）」",
  sub:    "社内開発レビュー会",
  foot:   "取扱注意 — 本資料の複製・持ち出しを禁ずる",
};

// 入場QRの画像。この名前で置いてあれば自動で入る。
// 無くても、開始画面に画像をドロップすれば割り当たります。
const QR_IMAGE = "../assets/qr/qr_slide_1920.png";
const QR_URL = "https://ai-shacho-981107538052.asia-northeast1.run.app/";

// 動画の置き場所。この名前で docs/video/ にあれば自動で読み込む。
// 名前が違っても、開始画面にドロップすれば割り当たります。
const VIDEO_DIR = "video/";

// つなぎスライドの共通部分（MCが喋っている間に映しておく画面）
const BRIDGE = {
  mark: "AI社長（President-1.0）",
  foot: "CONFIDENTIAL ／ 社外秘",
};
// つなぎを挟むかどうか。false にすると本編だけの並びに戻ります
const USE_BRIDGE = true;

// ★本番の並び（本編）。この順に進みます。
//   type   : title / video / qr / standby /（必要なら quiz-q, quiz-ab も使えます）
//   cue    : 進行役へのメモ（★画面には出ません。C キーの印刷用カンペにだけ出ます）
//   bridge : このスライドのあとに挟むつなぎ画面。
//            { n: 小見出し, cap: 大きい文字 }。省略・null なら挟みません。
//            ★次に何が出るかを言い過ぎないこと（オチが割れます）
const CONTENT = [
  { type: "title", label: "① タイトル",
    cue: "開場中はこれを映しておく。MCが振ったら →（つなぎへ）",
    bridge: { n: "AGENDA 01", cap: "開発チームより、\nご報告があります" } },

  { type: "video", file: "01_appearance.mp4", label: "② 登場動画",
    cue: "再生。終わっても自動では進みません。受けてから →（つなぎへ）",
    bridge: { n: "AGENDA 02", cap: "President-1.0、\n起動を確認" } },

  { type: "video", file: "02_intro.mp4", label: "③ 自己紹介動画",
    cue: "MCの受けのあと →（つなぎへ）",
    bridge: { n: "TEST 01", cap: "これより、精度検証に入ります" } },

  { type: "video", file: "03_q1.mp4", label: "④ Q1",
    cue: "MCが設問を振る → 再生。ご本人に一言もらってから →（つなぎへ）",
    bridge: { n: "TEST 02", cap: "検証、続けます" } },

  { type: "video", file: "04_q2.mp4", label: "⑤ Q2",
    cue: "同上。急がない",
    bridge: { n: "TEST 03", cap: "最後の検証です" } },

  { type: "video", file: "05_q3.mp4", label: "⑥ Q3",
    cue: "同上。ここが最後の問題",
    bridge: { n: "RESULT", cap: "検証結果は、\n皆さまの手元で" } },

  { type: "qr", label: "⑦ 入場QR（クロージング）",
    cue: "「お手元のスマホでどうぞ」。合言葉はスライドに出ています（読み上げると確実）" },
];

// 本編のあいだに、つなぎスライドを挟み込む
const SHOW = [];
CONTENT.forEach((c) => {
  SHOW.push(c);
  if (USE_BRIDGE && c.bridge) {
    SHOW.push({
      type: "bridge",
      n: c.bridge.n, cap: c.bridge.cap,
      label: `▷ つなぎ（${c.bridge.n}）`,
      cue: "★MCが喋っている間はこれを映しておく。次の合図で →",
    });
  }
});

/* ================================================================
   ここから下は進行の仕組み。通常は触らなくて大丈夫です
   ================================================================ */
const stage = document.getElementById("stage");
const els = [];
const slots = [];     // 動画スロット { showIndex, el, ph, name, src, ready }
let idx = 0, started = false, t0 = null;

const esc = (s) => String(s == null ? "" : s)
  .replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// --- スライドを全部つくって重ねる（あとで作らない＝切り替えで待たない）---
SHOW.forEach((sl, i) => {
  const d = document.createElement("div");
  d.className = "slide";

  if (sl.type === "title") {
    d.classList.add("title");
    d.innerHTML =
      (TITLE.badge ? `<div class="badge">${esc(TITLE.badge)}</div>` : "") +
      `<div class="kicker">${esc(TITLE.kicker)}</div>` +
      `<h1>${esc(TITLE.main).replace(/\n/g, "<br>")}</h1>` +
      `<div class="rule"></div>` +
      `<div class="sub">${esc(TITLE.sub).replace(/\n/g, "<br>")}</div>` +
      (TITLE.foot ? `<div class="foot">${esc(TITLE.foot)}</div>` : "");

  } else if (sl.type === "bridge") {
    d.classList.add("bridge");
    d.innerHTML =
      `<div class="mark">${esc(BRIDGE.mark)}</div>` +
      `<div class="cap">` +
        (sl.n ? `<span class="n">${esc(sl.n)}</span>` : "") +
        esc(sl.cap || "").replace(/\n/g, "<br>") +
      `</div>` +
      `<div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>` +
      (BRIDGE.foot ? `<div class="foot">${esc(BRIDGE.foot)}</div>` : "");

  } else if (sl.type === "video") {
    d.classList.add("plain");
    const v = document.createElement("video");
    v.preload = "auto"; v.playsInline = true; v.controls = false;
    d.appendChild(v);
    const ph = document.createElement("div");
    ph.className = "missing";
    ph.innerHTML = `<b>${esc(sl.label)}</b><br>動画がまだ割り当てられていません<br>` +
      `<span style="color:#93a89b;font-size:2.6vh">開始画面でドロップすると入ります</span>`;
    d.appendChild(ph);
    slots.push({ showIndex: i, kind: "video", el: v, ph, label: sl.label, file: sl.file, src: null, ready: false });

  } else if (sl.type === "qr") {
    // QRも動画と同じ枠組みで扱う（規定の場所にあれば自動、無ければドロップ）
    d.classList.add("qr", "plain");
    const img = document.createElement("img");
    img.alt = "AI社長アプリの入場QRコード";
    d.appendChild(img);
    const ph = document.createElement("div");
    ph.className = "missing";
    ph.innerHTML = `<b>${esc(sl.label)}</b><br>QR画像がまだ割り当てられていません<br>` +
      `<span style="color:#93a89b;font-size:2.4vh">開始画面でドロップすると入ります<br>${esc(QR_URL)}</span>`;
    d.appendChild(ph);
    slots.push({ showIndex: i, kind: "image", el: img, ph, label: sl.label, file: sl.file || QR_IMAGE, src: null, ready: false });

  } else if (sl.type === "quiz-q") {
    d.innerHTML = `<div class="qnum">Q${esc(sl.n)}</div><div class="qtext">${esc(sl.q)}</div>`;

  } else if (sl.type === "quiz-ab") {
    d.innerHTML = `<div class="kicker2">どちらが本物の佐々木社長？</div>
      <div class="ab">
        <div class="opt"><span class="tag">A</span><p>${esc(sl.a)}</p></div>
        <div class="opt"><span class="tag">B</span><p>${esc(sl.b)}</p></div>
      </div>`;

  } else {
    d.innerHTML = `<div class="standby-title">${esc(sl.title || "")}</div>` +
      (sl.sub ? `<div class="standby-sub">${esc(sl.sub)}</div>` : "");
  }

  stage.appendChild(d);
  els.push(d);
});

/* ---------------- 動画の割り当て（名前に依存しない） ---------------- */
const slotsBox = document.getElementById("slots");
const bootBar = document.getElementById("bootBar");
const bootStat = document.getElementById("bootStat");
const bootErr = document.getElementById("bootErr");
const startBtn = document.getElementById("startBtn");

function paintSlots() {
  slotsBox.innerHTML = slots.map((s, i) => `
    <div class="slot ${s.ready ? "ok" : ""}" data-slot="${i}">
      <span class="no">${i + 1}</span>
      ${!s.ready ? `<span class="thumb empty"></span>`
        : s.kind === "image"
          ? `<img class="thumb" src="${esc(s.src)}" alt="">`
          : `<video class="thumb" src="${esc(s.src)}" muted preload="metadata" title="クリックで音なし再生（中身の確認用）"></video>`}
      <span class="name">${esc(s.label)}</span>
      <span class="file ${s.ready ? "" : "none"}">${esc(s.ready ? s.srcName : "未割当（ここにドロップ）")}</span>
      <span class="swap">
        <button data-up="${i}" ${i === 0 || slots[i - 1].kind !== s.kind ? "disabled" : ""} title="ひとつ上と入れ替え">▲</button>
        <button data-down="${i}" ${i === slots.length - 1 || slots[i + 1].kind !== s.kind ? "disabled" : ""} title="ひとつ下と入れ替え">▼</button>
      </span>
    </div>`).join("");
  // サムネイルは頭の絵より少し進めたほうが中身が分かる
  slotsBox.querySelectorAll("video.thumb").forEach((v) => {
    v.addEventListener("loadedmetadata", () => { try { v.currentTime = Math.min(1.5, (v.duration || 2) / 3); } catch (e) {} }, { once: true });
  });
  const done = slots.filter((s) => s.ready).length;
  bootBar.style.width = (slots.length ? (done / slots.length) * 100 : 100) + "%";
  bootStat.textContent = `素材 ${done} / ${slots.length} 個 割り当て済み（動画5・QR画像1）`;
  bootErr.textContent = done === slots.length ? ""
    : `⚠️ ${slots.length - done} 個が未割当です。このままでも進行の練習はできます（その場面は代役が出ます）。`;
  document.getElementById("checkNote").textContent = done
    ? "★まとめてドロップした場合、並びはファイル名順です。サムネイルで中身を確かめ、違っていたら ▲▼ で入れ替えてください。"
    : "";
}

// サムネイルのクリックで、その動画を音なし再生（どのクリップか目で確認する）
slotsBox.addEventListener("click", (e) => {
  const up = e.target.closest("[data-up]"), down = e.target.closest("[data-down]");
  if (up) { swapSlots(+up.dataset.up, +up.dataset.up - 1); return; }
  if (down) { swapSlots(+down.dataset.down, +down.dataset.down + 1); return; }
  const th = e.target.closest("video.thumb");
  if (th) { th.muted = true; th.paused ? th.play().catch(() => {}) : th.pause(); }
});

// 割り当てを入れ替える（まとめてドロップの並びが違ったときの直し方）
function swapSlots(i, j) {
  if (i < 0 || j < 0 || i >= slots.length || j >= slots.length) return;
  if (slots[i].kind !== slots[j].kind) return;   // 動画↔画像は入れ替えない
  const a = slots[i], b = slots[j];
  [a.src, b.src] = [b.src, a.src];
  [a.srcName, b.srcName] = [b.srcName, a.srcName];
  [a.ready, b.ready] = [b.ready, a.ready];
  [a, b].forEach((s) => {
    if (s.ready) { s.el.src = s.src; s.el.style.display = ""; s.ph.style.display = "none"; s.el.load(); }
    else { s.el.removeAttribute("src"); s.el.style.display = "none"; s.ph.style.display = ""; }
  });
  paintSlots();
}

// 1つのスロットに素材を割り当てる（動画・画像の両方）
function assign(i, src, name) {
  const s = slots[i];
  if (s.src && s.src.startsWith("blob:")) URL.revokeObjectURL(s.src);
  s.src = src; s.srcName = name; s.ready = true;
  s.el.src = src;
  s.el.style.display = "";
  s.ph.style.display = "none";
  if (s.kind !== "image") s.el.load();
  paintSlots();
}
function unassigned(i) {
  const s = slots[i];
  s.ready = false; s.el.style.display = "none"; s.ph.style.display = "";
}

// ① まず規定の場所を試す（あれば手間ゼロ）
//    動画 … docs/video/ の規定ファイル名 ／ QR … QR_IMAGE のパス
let probed = 0;
slots.forEach((s, i) => {
  unassigned(i);
  if (!s.file) { probed++; return; }
  const path = s.kind === "image" ? s.file : VIDEO_DIR + s.file;
  const shortName = path.split("/").pop();
  const probe = s.kind === "image" ? new Image() : document.createElement("video");
  if (s.kind !== "image") probe.preload = "metadata";
  let settled = false;
  const finish = (ok) => {
    if (settled) return; settled = true;
    if (ok) assign(i, path, shortName);
    probed++;
    if (probed >= slots.length) { paintSlots(); startBtn.disabled = false; }
  };
  if (s.kind === "image") probe.addEventListener("load", () => finish(true), { once: true });
  else probe.addEventListener("loadedmetadata", () => finish(true), { once: true });
  probe.addEventListener("error", () => finish(false), { once: true });
  setTimeout(() => finish(false), 6000);
  probe.src = path;
});
if (!slots.length) { startBtn.disabled = false; }
paintSlots();

// ② ドロップ／ファイル選択で割り当てる（★ファイル名は何でもよい）
const drop = document.getElementById("drop");
const picker = document.getElementById("picker");

const isVideoFile = (f) => f.type.startsWith("video/") || /\.(mp4|mov|m4v|webm)$/i.test(f.name);
const isImageFile = (f) => f.type.startsWith("image/") || /\.(png|jpe?g|webp|gif|svg)$/i.test(f.name);
const byName = (a, b) => a.name.localeCompare(b.name, "ja", { numeric: true });

function takeFiles(files, targetSlot) {
  const list = Array.from(files).filter((f) => isVideoFile(f) || isImageFile(f));
  if (!list.length) return;

  if (targetSlot != null) {                    // 1行にドロップ＝その枠だけ差し替え
    const want = slots[targetSlot].kind === "image" ? isImageFile : isVideoFile;
    const f = list.find(want) || list[0];      // 種類が合うものを優先
    assign(targetSlot, URL.createObjectURL(f), f.name);
    return;
  }
  // まとめてドロップ＝動画は動画の枠へ、画像は画像の枠へ、それぞれ名前順で上から
  const vids = list.filter(isVideoFile).sort(byName);
  const imgs = list.filter(isImageFile).sort(byName);
  const vSlots = slots.map((s, i) => (s.kind === "video" ? i : -1)).filter((i) => i >= 0);
  const iSlots = slots.map((s, i) => (s.kind === "image" ? i : -1)).filter((i) => i >= 0);
  vids.slice(0, vSlots.length).forEach((f, k) => assign(vSlots[k], URL.createObjectURL(f), f.name));
  imgs.slice(0, iSlots.length).forEach((f, k) => assign(iSlots[k], URL.createObjectURL(f), f.name));
}

["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => {
  e.preventDefault(); drop.classList.add("hover");
}));
["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, (e) => {
  e.preventDefault(); drop.classList.remove("hover");
}));
drop.addEventListener("drop", (e) => takeFiles(e.dataTransfer.files, null));
drop.addEventListener("click", () => picker.click());
picker.addEventListener("change", () => takeFiles(picker.files, null));

// 行ごとのドロップ（1本だけ差し替えたいとき）
slotsBox.addEventListener("dragover", (e) => {
  const row = e.target.closest(".slot"); if (!row) return;
  e.preventDefault(); row.classList.add("drop-hover");
});
slotsBox.addEventListener("dragleave", (e) => {
  const row = e.target.closest(".slot"); if (row) row.classList.remove("drop-hover");
});
slotsBox.addEventListener("drop", (e) => {
  const row = e.target.closest(".slot"); if (!row) return;
  e.preventDefault(); row.classList.remove("drop-hover");
  takeFiles(e.dataTransfer.files, parseInt(row.dataset.slot, 10));
});
// ページ全体でのドロップは無効化（ブラウザが動画を開いてしまうのを防ぐ）
window.addEventListener("dragover", (e) => e.preventDefault());
window.addEventListener("drop", (e) => { if (!e.target.closest("#drop, #slots")) e.preventDefault(); });

/* ---------------- 開始（音声の解錠・フルスクリーン） ---------------- */
startBtn.addEventListener("click", async () => {
  // 無音で一瞬再生してすぐ止める＝以降の play() が許可される
  for (const s of slots) {
    if (!s.ready || s.kind !== "video") continue;   // 画像は解錠の対象外
    try { s.el.muted = true; await s.el.play(); s.el.pause(); s.el.currentTime = 0; s.el.muted = false; }
    catch (e) { /* 解錠できなくても進む */ }
  }
  document.getElementById("boot").classList.add("done");
  try { await document.documentElement.requestFullscreen(); } catch (e) { /* 手動でF11 */ }
  try { await navigator.wakeLock.request("screen"); } catch (e) { /* 非対応でも進む */ }
  started = true; t0 = Date.now();
  show(0); tick();
});

/* ---------------- 進行 ---------------- */
function currentVideo() {
  const s = slots.find((x) => x.showIndex === idx);
  return s && s.ready && s.kind === "video" ? s.el : null;
}
function show(n) {
  n = Math.max(0, Math.min(SHOW.length - 1, n));
  const prev = currentVideo();
  if (prev) prev.pause();
  els[idx].classList.remove("on");
  idx = n;
  els[idx].classList.add("on");
  const v = currentVideo();
  if (v) { v.currentTime = 0; v.play().catch(() => {}); }
  paintHud();
}
const next = () => show(idx + 1);
const back = () => show(idx - 1);

document.addEventListener("keydown", (e) => {
  if (!started) return;
  const k = e.key;
  if (k === " " || k === "Spacebar") {
    e.preventDefault();                       // 画面が飛ぶのを防ぐ
    const v = currentVideo();
    if (v) { v.paused ? v.play().catch(() => {}) : v.pause(); paintHud(); }
    return;                                   // ★Space では絶対に進まない
  }
  if (k === "ArrowRight" || k === "Enter" || k === "PageDown") { e.preventDefault(); next(); return; }
  if (k === "ArrowLeft" || k === "PageUp") { e.preventDefault(); back(); return; }
  if (k === "b" || k === "B") { document.getElementById("blackout").classList.toggle("on"); return; }
  if (k === "h" || k === "H") { document.getElementById("hud").classList.toggle("on"); return; }
  if (k === "c" || k === "C") { printCue(); return; }
  if (k === "f" || k === "F") { document.documentElement.requestFullscreen().catch(() => {}); return; }
});
document.addEventListener("click", (e) => {
  if (!started || e.target.closest("#hud")) return;
  next();
});

/* ---------------- 進行情報の帯（★既定は非表示） ---------------- */
function paintHud() {
  const cur = SHOW[idx], nx = SHOW[idx + 1];
  document.getElementById("hudNow").textContent = `${idx + 1}/${SHOW.length}　${cur.label}`;
  document.getElementById("hudNext").textContent = nx ? `次 → ${nx.label}` : "（最後です）";
  const v = currentVideo();
  document.getElementById("hudV").textContent = v ? (v.paused ? "⏸ 一時停止中" : "▶ 再生中") : "";
}
function tick() {
  if (t0) {
    const s = Math.floor((Date.now() - t0) / 1000);
    document.getElementById("hudClock").textContent =
      String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  }
  const v = currentVideo();
  if (v) document.getElementById("hudV").textContent = v.paused ? "⏸ 一時停止中" : "▶ 再生中";
  setTimeout(tick, 500);
}

/* ---------------- 印刷用カンペ（★これを紙で持つ） ---------------- */
function printCue() {
  const rows = SHOW.map((s, i) => `<tr>
      <td class="n">${i + 1}</td>
      <td class="l">${esc(s.label)}</td>
      <td>${esc(s.cue || "")}</td>
    </tr>`).join("");
  const w = window.open("", "_blank", "width=900,height=1100");
  if (!w) { alert("ポップアップがブロックされました。許可してから C をもう一度押してください。"); return; }
  w.document.write(`<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8">
    <title>進行カンペ｜AI社長 余興</title><style>
    body{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;margin:18mm 14mm;color:#111}
    h1{font-size:16pt;margin:0 0 4mm}
    .keys{font-size:10pt;background:#f2f5f1;border:1px solid #cfd8d0;padding:3mm 4mm;border-radius:3mm;margin-bottom:5mm;line-height:1.9}
    table{width:100%;border-collapse:collapse;font-size:11pt}
    th,td{border-bottom:1px solid #ddd;padding:3mm 2mm;text-align:left;vertical-align:top}
    th{background:#eef3ec;font-size:9.5pt}
    td.n{width:8mm;color:#888}
    td.l{width:50mm;font-weight:700}
    tr{break-inside:avoid}
    @page{size:A4;margin:14mm}
    </style></head><body>
    <h1>進行カンペ｜AI社長 余興</h1>
    <div class="keys">
      <b>&rarr; / Enter / クリック</b>＝次へ　　<b>Space</b>＝動画の再生・一時停止（進みません）　　<b>&larr;</b>＝戻る<br>
      <b>B</b>＝暗転　　<b>H</b>＝進行情報の帯（※会場に映るので本番中は消す）　　<b>F</b>＝フルスクリーン<br>
      ★動画は終わっても自動で進みません。MCの合図で &rarr; を押してください。
    </div>
    <table><thead><tr><th>#</th><th>画面</th><th>進行役がやること</th></tr></thead>
    <tbody>${rows}</tbody></table>
    </body></html>`);
  w.document.close();
  setTimeout(() => w.print(), 400);
}

/* ---------------- 事故防止 ---------------- */
let curTimer = null;
document.addEventListener("mousemove", () => {
  document.body.classList.remove("hide-cursor");
  clearTimeout(curTimer);
  curTimer = setTimeout(() => document.body.classList.add("hide-cursor"), 2000);
});
window.addEventListener("beforeunload", (e) => {
  if (started) { e.preventDefault(); e.returnValue = ""; }
});
</script>
</body>
